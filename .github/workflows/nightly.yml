name: Nightly Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  # ============================================================================
  # Full Test Suite
  # ============================================================================
  full-test-suite:
    name: Full Test Suite
    # Canonical repo only. Scheduled workflows run on the default branch of any
    # fork with Actions enabled, but forks lack the private submodules + secrets
    # this suite needs, so a nightly run just emails the fork owner a failure.
    # Skipping (not failing) keeps forks quiet.
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deeptempo_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v7
        with:
          # requirements.lock installs -e ./mempalace, an empty dir without this.
          submodules: true
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      
      - name: Run all tests
        run: |
          pytest tests/ -v --cov --cov-report=xml --cov-report=term
        env:
          TESTING: true
          DATABASE_URL: postgresql://test:test@localhost:5432/deeptempo_test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: nightly
          name: nightly-full-suite

  # ============================================================================
  # Performance Regression Tests
  # ============================================================================
  performance-tests:
    name: Performance Regression Tests
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest-benchmark
      
      - name: Run performance tests
        run: |
          pytest tests/ -m performance --benchmark-only --benchmark-json=benchmark.json || true
      
      - name: Store benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark.json

  # ============================================================================
  # Security Audit
  # ============================================================================
  security-audit:
    name: Security Audit
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      
      - name: Run pip-audit
        run: |
          pip install pip-audit
          # The lock, not requirements.txt: open ranges audit versions nothing installs.
          # Findings are not a build failure. pip-audit not running is -- and it
          # writes no report at all when it fails, so an empty file is the tell.
          pip-audit -r requirements.lock --format json --output pip-audit.json || true
          test -s pip-audit.json || {
            echo "::error::pip-audit wrote no report -- it did not run"
            exit 1
          }

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        with:
          name: security-audit
          path: pip-audit.json

      - name: Summarise findings
        run: |
          python3 -c '
          import json
          deps = json.load(open("pip-audit.json")).get("dependencies", [])
          hits = [(d["name"], d["version"], v["id"]) for d in deps for v in d.get("vulns", [])]
          print(f"{len(hits)} known vulnerabilities in {len(deps)} dependencies")
          for name, version, vid in hits:
              print(f"  {name} {version}: {vid}")
          '

  # ============================================================================
  # Notify on Failure
  # ============================================================================
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [full-test-suite, performance-tests, security-audit]
    if: failure() && github.repository == 'Vigil-SOC/vigil'
    # `secrets` is not available in `if`, so it comes through env to be tested.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          # v4 wants the webhook as an input; env alone is "Missing input!".
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⚠️ Nightly Tests Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*⚠️ Nightly Tests Failed*\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Action:* Review test results"
                  }
                }
              ]
            }

